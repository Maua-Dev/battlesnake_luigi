[package]
name = "battlesnake"
version = "1.0.0"
edition = "2021"
description = "Ordering V3 SnakeBollada on the Maua AWS Lambda Battlesnake template"

[dependencies]
lambda_http = "1"
tokio = { version = "~1.51", features = ["macros", "rt-multi-thread", "rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-log = "0.2"
log = "0.4"
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
